[package]
name = "sshenc-se"
description = "Hardware-backed key management for sshenc (Secure Enclave / TPM)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["webauthn-sk"]
# Compiles in a software-only signing backend and lets the runtime
# `SSHENC_FORCE_SOFTWARE=1` env var select it instead of the platform
# hardware backend. Test-only — never enabled in shipping builds.
force-software = ["dep:enclaveapp-test-software", "dep:enclaveapp-core"]
# Compiles in the FIDO2 SK / WebAuthn key path (`sshenc keygen --strong`).
# When disabled, sshenc only knows the legacy ecdsa-sha2-nistp256 path.
# Default-on; gate exists so build profiles that don't want the WebAuthn
# surface area can opt out at compile time.
webauthn-sk = []

[dependencies]
sshenc-core = { workspace = true }
sshenc-agent-proto = { workspace = true }
hardware-enclave = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
enclaveapp-test-software = { workspace = true, optional = true }
# enclaveapp-core is needed only for the force-software test feature to access
# the EnclaveKeyManager/EnclaveSigner trait bounds on SoftwareSigner.
enclaveapp-core = { path = "../../../libenclaveapp/crates/enclaveapp-core", optional = true }
sha2 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
sshenc-test-support = { workspace = true }

[lints]
workspace = true
