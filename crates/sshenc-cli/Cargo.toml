[package]
name = "sshenc-cli"
description = "Main CLI for sshenc Secure Enclave SSH key management"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "sshenc"
path = "src/main.rs"

[features]
default = ["webauthn-sk"]
# Forwards the `force-software` flag down to sshenc-se + sshenc-agent
# so the whole binary set exposes `SSHENC_FORCE_SOFTWARE=1` at runtime.
# Test-only.
force-software = ["sshenc-se/force-software", "sshenc-agent/force-software"]
# Compiles in the FIDO2 / Windows Hello SK key path
# (`sshenc keygen --strong`). Default-on; can be disabled at build
# time for binaries that don't want the WebAuthn surface area.
webauthn-sk = ["sshenc-se/webauthn-sk"]

[dependencies]
sshenc-core = { workspace = true }
sshenc-se = { workspace = true }
sshenc-agent = { workspace = true }
hardware-enclave = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
sshenc-agent-proto = { workspace = true }

[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
sshenc-test-support = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
