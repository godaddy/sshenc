[package]
name = "sshenc-se"
description = "Hardware-backed key management for sshenc (Secure Enclave / TPM)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["webauthn-sk"]
# Enables the `SSHENC_FORCE_SOFTWARE=1` env var escape hatch which routes
# through hardware-enclave's built-in mock signer (Linux only; no hardware,
# no SE, no TPM).  Test-only — never enabled in shipping builds.
force-software = ["hardware-enclave/mock"]
# Compiles in the FIDO2 SK / WebAuthn key path (`sshenc keygen --strong`).
# When disabled, sshenc only knows the legacy ecdsa-sha2-nistp256 path.
# Default-on; gate exists so build profiles that don't want the WebAuthn
# surface area can opt out at compile time.
webauthn-sk = []

[dependencies]
sshenc-core = { workspace = true }
sshenc-agent-proto = { workspace = true }
hardware-enclave = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
sshenc-test-support = { workspace = true }

[lints]
workspace = true
